services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: exchange_rates
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange -d exchange_rates"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
    postgres_data:

