server {
    listen 80;
    server_name localhost;

    # Let the API enforce its own request body limit and return its JSON errors.
    client_max_body_size 0;
    proxy_set_header Host $http_host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_redirect off;

    location /rates/ {
        # No URI suffix: retain the original path and query string.
        # Request headers (including Idempotency-Key) and bodies pass through.
        proxy_pass http://app:8080;
    }

    location / {
        proxy_pass http://swagger-ui:8080;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # Inject UI-only styling into uncompressed HTML. Keep live responses visible.
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<style>
            .swagger-ui .responses-wrapper:not(:has(.live-responses-table)),
            .swagger-ui .responses-inner > .responses-table,
            .swagger-ui .responses-inner > div > h4,
            .swagger-ui section.models { display: none; }
        </style></head>';
        sub_filter_once on;
    }
}
