# Docker DNS refreshes the replica list after scaling and replacement.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream exchange_api {
    zone exchange_api 64k;
    server app:8080 resolve;
}
server {
    listen 80;
    server_name localhost;
    client_max_body_size 0;
    location / {
        proxy_pass http://exchange_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_redirect off;
        # Do not replay a client request on another replica implicitly.
        proxy_next_upstream off;
    }
}
